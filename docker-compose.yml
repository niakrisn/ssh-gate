name: ssh-gate

services:
  ssh-gate:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:20443:20443"
    volumes:
      - type: bind
        source: ./data
        target: /data
      - type: tmpfs
        target: /tmp
    environment:
      SSH_HOST: "${SSH_HOST}"
      SSH_PORT: "22"
      SSH_USER: "${SSH_USER}"
      PROXY_MODES: "socks5,mtproto"
      SOCKS5_LISTEN: "0.0.0.0:1080"
      MTPROTO_LISTEN: "0.0.0.0:20443"
      DIRECT_RULES: "re:\\.ru$,re:google\\.com$,ip:${DIRECT_RULES_IPS},ip:${DIRECT_RULES_IPS},ip:${DIRECT_RULES_IPS},ip:${DIRECT_RULES_IPS}"
      DIRECT_IP_FAMILY: "ipv4"
      DOH_IP: "9.9.9.9"
      LOG_LEVEL: "info"
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "sh", "-c", "echo | nc -z -w 2 127.0.0.1 1080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
