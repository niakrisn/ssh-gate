name: ssh-gate

services:
  ssh-gate:
    build: .
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "3128:3128"
      - "127.0.0.1:9090:9090"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /etc/ssh-gate/config.yaml
        read_only: true
      - type: bind
        source: ./data
        target: /data
      - type: tmpfs
        target: /tmp
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
