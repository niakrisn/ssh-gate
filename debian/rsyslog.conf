# Installed by ssh-gate. Keeps the access log (one line per proxied
# connection) out of the syslog files: read it with
#   journalctl -u ssh-gate -t ssh-gate-access
# The service log (ssh-gate) still goes to syslog. The 40- prefix sorts
# this file before the distribution rules in 50-default.conf. No restart
# is needed after install: rsyslog has a dpkg trigger on /etc/rsyslog.d and
# restarts itself.
:programname, isequal, "ssh-gate-access" stop
