name: ssh-gate

services:
  ssh-gate:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:20443:20443"
    volumes:
      - type: bind
        source: ./data
        target: /data
      - type: tmpfs
        target: /tmp
    environment:
      SSH_HOST: "${SSH_HOST}"
      SSH_PORT: "${SSH_PORT:-22}"
      SSH_USER: "${SSH_USER}"
      PROXY_MODES: "${PROXY_MODES:-socks5,mtproto}"
      SOCKS5_LISTEN: "${SOCKS5_LISTEN:-0.0.0.0:1080}"
      MTPROTO_LISTEN: "${MTPROTO_LISTEN:-0.0.0.0:20443}"
      DIRECT_RULES: "${DIRECT_RULES}"
      DIRECT_IP_FAMILY: "${DIRECT_IP_FAMILY:-ipv4}"
      DOH_IP: "${DOH_IP:-9.9.9.9}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SSH_KEEPALIVE_PERIOD: "${SSH_KEEPALIVE_PERIOD:-90s}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
